name: Emulator test
on:
  push:
    branches: [bookscan]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease -Pemu --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash tools/emu-test.sh
      - name: Publish test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd emu-out && zip -q ../emu-api${{ matrix.api }}.zip * && cd ..
          gh release create bookscan-test --target "$GITHUB_SHA" --title "emulator test" --notes "test logs" --prerelease || true
          gh release upload bookscan-test emu-api${{ matrix.api }}.zip --clobber
