name: Build APK

on:
  push:
    branches: [standby]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Android SDK가 미리 설치된 이미지로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK 빌드
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: 실패 로그 저장 (standby-build-log 브랜치)
        if: failure()
        run: |
          touch build.log
          { echo "run ${{ github.run_number }} / commit ${{ github.sha }}"; env | grep -i android || true; cat build.log; } > /tmp/build.log
          grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
          mkdir -p /tmp/logrepo && cp /tmp/build.log /tmp/logrepo/build.log && cd /tmp/logrepo
          git init -q && git checkout -q -b standby-build-log
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add build.log && git commit -qm "build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" standby-build-log

      - name: APK 확인 및 이름 변경
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk GalaxyStandByPro-debug.apk
          ls -la GalaxyStandByPro-debug.apk

      - name: Actions 결과물로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStandByPro-debug
          path: GalaxyStandByPro-debug.apk

      # 휴대폰 브라우저에서 바로 받을 수 있도록 Releases에도 올림 (압축 없이 .apk 그대로)
      - name: Releases에 APK 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standby-build-${{ github.run_number }}
          name: Galaxy StandBy Pro 빌드 ${{ github.run_number }}
          body: "자동 빌드된 디버그 APK입니다. 아래 GalaxyStandByPro-debug.apk를 눌러 받으세요."
          files: GalaxyStandByPro-debug.apk
          prerelease: true
