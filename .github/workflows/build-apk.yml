name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK 확인 및 이름 변경
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk GalaxyStandByPro-debug.apk
          ls -la GalaxyStandByPro-debug.apk

      - name: Actions 결과물로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStandByPro-debug
          path: GalaxyStandByPro-debug.apk

      # 휴대폰 브라우저에서 바로 받을 수 있도록 Releases에도 올림 (압축 없이 .apk 그대로)
      - name: Releases에 APK 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standby-build-${{ github.run_number }}
          name: Galaxy StandBy Pro 빌드 ${{ github.run_number }}
          body: "자동 빌드된 디버그 APK입니다. 아래 GalaxyStandByPro-debug.apk를 눌러 받으세요."
          files: GalaxyStandByPro-debug.apk
          prerelease: true
